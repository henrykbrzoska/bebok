name: Android

# WP-M3 (F10-11): builds + smoke-tests the Android APK. Additional to (never
# a replacement for) ci.yml, which stays the PR gate for engine/client on
# ubuntu-latest and windows-latest.
#
#   build            ubuntu-24.04: cross-compile the engine for arm64-v8a +
#                     x86_64 (F10-9), `ng build`, `cap sync android`,
#                     `gradlew assembleRelease` -> upload the APK
#   emulator-smoke   boots an API 34 x86_64 emulator, installs the APK, runs
#                     the Maestro flows in client/maestro/**
#
# Signing is OPTIONAL, gated on repository secrets (see scripts/release.md):
#   ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD +
#   ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD
# Without them, `assembleRelease` produces a debug-signed APK (filename
# suffix `-debugkey`) - see android/app/build.gradle.
#
# Budget: the `build` job should stay under ~25 min with warm Rust/Gradle
# caches (see the WP-M3 report for measured times on the introducing run).

on:
  # Build a signed APK from any branch on demand:
  #   gh workflow run android.yml --ref <branch> && gh run download <run-id>
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/**'
      - 'engine/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main, master]
    paths:
      - 'client/**'
      - 'engine/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: 22
  RUST_TARGETS: aarch64-linux-android,x86_64-linux-android
  NDK_VERSION: r27c

jobs:
  build:
    name: build (arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    outputs:
      apk-name: ${{ steps.locate-apk.outputs.apk-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK (${{ env.NDK_VERSION }})
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGETS }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # A comma in the key fails rust-cache validation (it did on 1.6.0).
          shared-key: android-multi-abi
          workspaces: |
            engine -> target

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Bundle engine (arm64-v8a + x86_64)
        working-directory: client
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          BEBOK_ANDROID_ABIS: 'arm64-v8a x86_64'
        run: bash scripts/bundle-android.sh

      - name: ng build
        working-directory: client
        run: npx ng build

      - name: cap sync android
        working-directory: client
        run: npx cap sync android

      # ---- optional: release keystore from repository secrets -------------
      - name: Decode signing keystore (optional)
        id: sign
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/bebok-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          echo "keystore=$ks" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Signing skipped
        if: steps.sign.outputs.signed != 'true'
        shell: bash
        run: echo "::notice title=Android signing skipped::ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD not all set - assembleRelease will produce a debug-signed APK (-debugkey suffix)."

      - name: gradlew assembleRelease
        working-directory: client/android
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            args+=(
              "-Pbebok.keystore=${{ steps.sign.outputs.keystore }}"
              "-Pbebok.keystorePassword=${{ env.ANDROID_KEYSTORE_PASSWORD }}"
              "-Pbebok.keyAlias=${{ env.ANDROID_KEY_ALIAS }}"
              "-Pbebok.keyPassword=${{ env.ANDROID_KEY_PASSWORD }}"
            )
          fi
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest "${args[@]}"

      - name: Remove decoded keystore
        if: always() && steps.sign.outputs.signed == 'true'
        shell: bash
        run: rm -f "${{ steps.sign.outputs.keystore }}"

      - name: Locate APK
        id: locate-apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find client/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "::error::no APK produced"; exit 1; fi
          echo "apk-name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          # F10-29: the engine must ship as an extracted native library
          # (lib/<abi>/libbebok_server.so) - the only exec-allowed location on
          # Android 10+. A build that silently dropped it would only work in
          # Remote mode.
          for abi in arm64-v8a x86_64; do
            unzip -l "$apk" | grep -q " lib/$abi/libbebok_server.so$" \
              || { echo "::error::lib/$abi/libbebok_server.so missing from $apk"; exit 1; }
          done
          if ! unzip -l "$apk" | grep -q " assets/bin/"; then echo "no legacy assets/bin/ in APK (ok)"; else echo "::error::stale assets/bin/ engine copy in $apk"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bebok-android-apk
          path: client/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: emulator-smoke (API 34, x86_64)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: bebok-android-apk
          path: apk

      - name: Enable KVM (nested virtualization)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run emulator + Maestro smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro test client/maestro/smoke.yaml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-results
          path: |
            ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 14
