<section class="about">
  <div class="about-col">
    <a class="back" routerLink="/">{{ t('about.back') }}</a>


    @if (loading()) {
      <p class="status">{{ t('about.loading') }}</p>

      <app-markdown-view [source]="content()" />

  </div>
