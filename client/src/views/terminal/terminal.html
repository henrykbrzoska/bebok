<section class="terminal">
  <!-- F2-18: 40px tab strip, one tab per engine PTY. -->
  <div class="tab-strip" role="tablist" [attr.aria-label]="t('term.title')">
    @for (tab of tabs(); track tab.ptyId) {
      <div
        class="tab"
        role="tab"
        [class.active]="activePtyId() === tab.ptyId"
        [attr.aria-selected]="activePtyId() === tab.ptyId"
        (click)="activate(tab.ptyId)"
        [title]="tab.title + ' — ' + statusLabel(tab.status)"
      >
        <span class="dot" [class]="'tone-' + tab.status" aria-hidden="true"></span>
        <span class="tab-title">{{ tab.title }}</span>
        <span class="sr-only">{{ statusLabel(tab.status) }}</span>
        <button
          class="tab-close"
          type="button"
          [attr.aria-label]="t('term.closeTab')"
          [title]="t('term.closeTab')"
          (click)="$event.stopPropagation(); closeTab(tab.ptyId)"
        >
          ✕
        </button>
      </div>
    }
    <button
      class="new-term"
      type="button"
      (click)="addTerminal()"
      [disabled]="loading() || !directory()"
    >
      + {{ t('term.new') }}
    </button>
  </div>

  @if (error()) {
    <div class="error-banner">{{ error() }}</div>
  }

  <!-- F2-19: terminal body. -->
  <div class="term-body">
    @if (activePtyId()) {
      <app-terminal-tab [ptyId]="activePtyId()!" (status)="onStatus(activePtyId()!, $event)" />
    } @else if (!loading()) {
      <div class="term-empty">
        <div class="prompt-line">
          <span class="prompt">{{ promptPrefix() }}</span>
          <span class="cursor" aria-hidden="true">▊</span>
        </div>
        <p class="empty-hint">{{ t('term.empty') }}</p>
      </div>
    }
  </div>
</section>
