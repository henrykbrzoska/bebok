<aside class="sidebar" [class.collapsed]="!expanded()">
  <div class="head">
    <div class="logo" aria-hidden="true"></div>
    @if (expanded()) {
      <div class="brand">Bebok</div>
      <button
        type="button"
        class="palette-btn"
        (click)="shell.openCommandPalette()"
        [title]="t('shell.openPalette')"
        [attr.aria-label]="t('shell.openPalette')"
      >
        <span class="cmd" aria-hidden="true">⌘</span>K
      </button>
    }
    <button
      type="button"
      class="collapse"
      (click)="shell.toggleSidebar()"
      [title]="expanded() ? t('shell.collapseSidebar') : t('shell.expandSidebar')"
      [attr.aria-label]="expanded() ? t('shell.collapseSidebar') : t('shell.expandSidebar')"
    >
      {{ expanded() ? '«' : '»' }}
    </button>
  </div>

  @if (expanded()) {
    <div class="project-block">
      <button
        type="button"
        class="project-row"
        (click)="switchProject()"
        [title]="t('sidebar.switchProject')"
      >
        <span class="project-text">
          <span class="micro-label">{{ t('sidebar.project') }}</span>
          <span class="project-path">{{ directory() || t('sidebar.noProject') }}</span>
        </span>
        <span class="chevron" aria-hidden="true">▾</span>
      </button>
    </div>

    <div class="search-block">
      <input
        type="text"
        class="search"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
        [placeholder]="t('sidebar.searchSessions')"
        [attr.aria-label]="t('sidebar.searchSessions')"
        spellcheck="false"
      />
    </div>

    <div class="new-block">
      <select
        class="agent-select"
        [ngModel]="selectedAgent()"
        (ngModelChange)="selectedAgent.set($event)"
        [attr.aria-label]="t('start.agent')"
      >
        @for (agent of agents(); track agent.name) {
          <option [value]="agent.name">{{ agentLabel(agent) }}</option>
        }
        @if (agents().length === 0) {
          <option value="code">code</option>
        }
      </select>
      <button
        type="button"
        class="new-btn"
        (click)="newSession()"
        [disabled]="creating() || !directory()"
        [title]="t('sidebar.newSessionTitle')"
      >
        {{ t('sidebar.newSession') }}
      </button>
    </div>
  }

  @if (!expanded()) {
    <nav class="rail">
      @for (item of navItems; track item.screen) {
        <button
          type="button"
          class="rail-btn"
          [class.active]="isActive(item.screen)"
          (click)="go(item.path)"
          [title]="t(item.labelKey)"
          [attr.aria-label]="t(item.labelKey)"
          [attr.aria-current]="isActive(item.screen) ? 'page' : null"
        >
          {{ t(item.railKey) }}
        </button>
      }
      <div class="rail-status">
        <app-status-dot [label]="statusLabel()" [tone]="statusTone()" [labelHidden]="true" />
      </div>
    </nav>
  }
</aside>
