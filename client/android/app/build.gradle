apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// ---------------------------------------------------------------------------
// F10-11: versionName/versionCode derive from client/package.json instead of
// being hard-coded here, so the workspace has a single source of truth for
// the release version (WP-M8 bumps package.json only). versionCode is a
// monotonically increasing integer Play/side-loading needs:
//   major * 10000 + minor * 100 + patch
// A pre-release suffix ("1.6.0-beta.1") only contributes its numeric patch
// prefix to versionCode (Play Store versionCode has no room for suffixes);
// versionName keeps the full string for display.
// ---------------------------------------------------------------------------
def packageJsonFile = file("$rootDir/../package.json")
def packageJson = new JsonSlurper().parse(packageJsonFile)
def bebokVersionName = packageJson.version as String
def versionParts = bebokVersionName.split('-')[0].tokenize('.')
def bebokVersionCode = (versionParts[0].toInteger() * 10000) +
    (versionParts[1].toInteger() * 100) +
    versionParts[2].toInteger()

// ---------------------------------------------------------------------------
// F10-11: optional release signing from Gradle properties (passed by CI as
// -Pbebok.keystore=... when ANDROID_KEYSTORE_BASE64 etc. are present as repo
// secrets; see .github/workflows/android.yml and scripts/release.md). When
// absent, `release` builds fall back to the debug signing config and the
// output APK is renamed with a `-debugkey` suffix so it is obviously not a
// production-signed artifact (mirrors the "skipped with a notice" style used
// for desktop signing in release.yml).
// ---------------------------------------------------------------------------
def hasCustomSigning = project.hasProperty('bebok.keystore') &&
    project.hasProperty('bebok.keystorePassword') &&
    project.hasProperty('bebok.keyAlias') &&
    project.hasProperty('bebok.keyPassword')

// ---------------------------------------------------------------------------
// F10-29: the embedded engine ships as a "native library"
// (src/main/jniLibs/<abi>/libbebok_server.so, produced by
// scripts/bundle-android.sh) because Android 10+ refuses to exec a file the
// app copied into its own data dir (W^X for untrusted_app). The installer
// extracts lib/<abi>/lib*.so into ApplicationInfo.nativeLibraryDir, which is
// exec-allowed, and EngineLauncherPlugin runs the engine from there. That
// needs (a) legacy packaging - uncompressed + extracted, not mmap'd from the
// APK (`useLegacyPackaging` = `android:extractNativeLibs="true"`) and (b) the
// APK limited to the ABIs the engine was actually built for, so the
// installer never picks an ABI (say, armeabi-v7a from a plugin's AAR) that
// has no engine. No jniLibs at all (bundle script not run) -> no filter, the
// APK builds without the engine and the app still works in Remote mode.
// ---------------------------------------------------------------------------
def engineLibName = 'libbebok_server.so'
def jniLibsDir = file('src/main/jniLibs')
def bundledEngineAbis = jniLibsDir.isDirectory()
    ? jniLibsDir.listFiles().findAll { it.isDirectory() && new File(it, engineLibName).isFile() }*.name.sort()
    : []
if (bundledEngineAbis.isEmpty()) {
    logger.warn("bebok: no engine under ${jniLibsDir} - run client/scripts/bundle-android.sh first; " +
        "this APK will not be able to run the embedded engine (Remote mode only)")
} else {
    logger.lifecycle("bebok: embedded engine bundled for ABIs ${bundledEngineAbis}")
}

android {
    namespace "dev.bebok.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.bebok.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode bebokVersionCode
        versionName bebokVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        if (!bundledEngineAbis.isEmpty()) {
            // F10-29: only ship ABIs that carry the engine (see above).
            ndk {
                abiFilters.addAll(bundledEngineAbis)
            }
        }
    }
    packaging {
        jniLibs {
            // F10-29: extract lib/<abi>/*.so at install time (sets
            // android:extractNativeLibs="true" in the merged manifest) so the
            // engine exists as a real, exec-allowed file in nativeLibraryDir.
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        if (hasCustomSigning) {
            release {
                storeFile file(project.property('bebok.keystore'))
                storePassword project.property('bebok.keystorePassword')
                keyAlias project.property('bebok.keyAlias')
                keyPassword project.property('bebok.keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // No secrets -> debug-signed (renamed below) rather than the
            // unsigned APK Gradle would otherwise produce for `release`.
            signingConfig hasCustomSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'release' && !hasCustomSigning) {
            variant.outputs.configureEach { output ->
                output.outputFileName = output.outputFileName.replace('.apk', '-debugkey.apk')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
