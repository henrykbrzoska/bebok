[package]
name = "bebok-desktop"
version = "1.4.0"
description = "Bebok desktop shell (Tauri 2)"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.77.2"

[lib]
name = "bebok_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
