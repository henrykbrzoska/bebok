[workspace]
resolver = "3"
members = [
    "crates/bebok-core",
    "crates/bebok-server",
    "crates/bebok-tools",
    "crates/bebok-llm",
    "crates/bebok-mcp",
    "crates/bebok-skills",
    "crates/bebok-pty",
    "crates/bebok-ast-cli",
]
default-members = ["crates/bebok-server"]

[workspace.package]
version = "1.8.5"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
dirs = "6"
flate2 = "1"
futures = "0.3"
glob = "0.3"
globset = "0.4"
http = "1"
ignore = "0.4"
notify = "8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
blake3 = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"

# Keep engine/target small: full debug info dominates it (every dependency
# rlib and test binary carries it, which is how the dir used to grow to 40+ GB
# of mixed generations). line-tables-only keeps line numbers for tests,
# backtraces and source-level debugging; only variable-location info is
# dropped. Use `CARGO_PROFILE_DEV_DEBUG=2` (or `cargo clean`) for a session
# that needs the full debuginfo.
[profile.dev]
debug = "line-tables-only"
# No dev builds in the local loop (release-only: engine --release + tauri
# build), so if a debug dir ever reappears (tauri dev, cargo test) keep it
# from ballooning with per-change incremental generations.
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
