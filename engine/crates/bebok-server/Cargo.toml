[package]
name = "bebok-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bebok-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bebok-core = { path = "../bebok-core" }
bebok-llm = { path = "../bebok-llm" }
bebok-tools = { path = "../bebok-tools" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
uuid.workspace = true
# WP-M1 (remote listener): device-token hashing + constant-time compare +
# token entropy. All pure Rust (no build scripts), build for Android too.
sha2.workspace = true
subtle = "2"
rand = "0.9"

[dev-dependencies]
# `oneshot` in the auth middleware tests (drives the assembled Router without
# binding a socket). Already in the lockfile via tower-http.
tower = { version = "0.5", features = ["util"] }
# WP-M1: registry fixtures + two-client pairing/SSE integration tests.
tempfile = "3"
reqwest.workspace = true

# portable-pty -> serial -> termios does not compile on Android; the terminal is
# disabled there (the rest of the engine - incl. the bash tool - still works).
[target.'cfg(not(target_os = "android"))'.dependencies]
bebok-pty = { path = "../bebok-pty" }
# WP-M1: tailnet/LAN interface enumeration for the remote listener. The phone
# is never a hub, so the listener (and this crate) are absent on Android.
if-addrs = "0.13"
